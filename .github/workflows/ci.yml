name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  lint:
    name: Format & lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --locked --all-targets -- -D warnings

  test:
    name: Tests (${{ matrix.profile }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # Debug is load-bearing, not redundant: the kernel's invariant
        # tripwires (the `debug_assert!`s on the wasm ABI's stream-handle
        # bound and on parallel-branch join bookkeeping) are
        # `debug_assertions`-gated and never execute under --release.
        profile: [debug, release]
    env:
      # Each integration-test binary links wasmtime statically. With
      # full DWARF that is several hundred MB apiece, and the 39 of
      # them exhaust the runner's disk mid-link (lld dies with SIGBUS).
      # Line tables keep panics and backtraces readable;
      # `debug_assertions` are unaffected, so the debug profile still
      # runs every tripwire.
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
      CARGO_PROFILE_TEST_DEBUG: line-tables-only
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --locked ${{ matrix.profile == 'release' && '--release' || '' }}

  msrv:
    name: MSRV (1.94)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.94"
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --locked --all-targets

  docs:
    name: Rustdoc (deny warnings)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo doc --locked --no-deps
        env:
          RUSTDOCFLAGS: -D warnings

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    # The action reports findings as a check run, which needs write
    # access the default token does not carry.
    permissions:
      contents: read
      checks: write
    steps:
      - uses: actions/checkout@v5
      - uses: rustsec/audit-check@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
