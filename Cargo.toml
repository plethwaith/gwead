[package]
name = "gwead"
version = "0.1.0"
edition = "2024"
rust-version = "1.92"
description = "Gwead — a WebAssembly plugin microkernel: a data-driven engine that loads plugin manifests and executes capability steps in sandboxed wasm."
license = "MIT OR Apache-2.0"
repository = "https://github.com/plethwaith/gwead"
homepage = "https://plethwaith.com"
keywords = ["wasm", "plugin", "wasmtime", "microkernel"]
categories = ["wasm"]
readme = "README.md"

# Gwead is a standalone microkernel: `[dependencies]` and `[dev-dependencies]`
# must never name an embedding application's crates. Dependencies flow strictly
# inward — embedders depend on gwead, never the reverse.

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
indexmap = { version = "2", features = ["serde"] }
bytes = "1"
tokio-util = { version = "0.7", features = ["io"] }
futures = "0.3"
tokio = { version = "1", features = ["rt", "rt-multi-thread", "macros", "sync", "time", "fs", "io-util"] }
thiserror = "2"
tracing = "0.1"
regex = "1"

# 44.x is the minimum line that carries the path_open(TRUNCATE) fix
# from RUSTSEC-2026-0149; 43.x has no backport.
wasmtime = "44"
wasmtime-wasi = "44"
base64 = "0.22"

# JSON Schema (Draft 2020-12) validation of manifests against the published
# meta-schemas in schemas/ — run on raw JSON before serde deserialization.
boon = "0.6"

# Compile-time native-impl discovery. Plugin crates push their step-body fn
# pointers into a global slice via `inventory::submit!`; the kernel walks the
# slice at boot via `NativeStepImplTable::discover()`. Mature, small, no deps.
inventory = "0.3"

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "time", "fs"] }
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
uuid = { version = "1", features = ["v4"] }
wat = "1"
